<section id="conoce" class="py-5">

  <div class="container-fluid px-4 px-lg-5">

    <div class="row justify-content-center align-items-center g-4">

      <!-- QUIÉNES SOMOS -->
      <div class="col-12 col-sm-6 col-lg-3 text-center">
        <button type="button" class="btn p-0 border-0 conoce-btn" data-bs-toggle="modal" data-bs-target="#modalContenido" (click)="abrirOpcion(opciones[0])" aria-label="Quiénes somos">
          <img class="img-fluid conoce-img" src="/assets/images/conoce/somos.png" alt="Quiénes somos">
        </button>
      </div>

      <!-- OBJETIVOS -->
      <div class="col-12 col-sm-6 col-lg-3 text-center">
        <button type="button" class="btn p-0 border-0 conoce-btn" data-bs-toggle="modal" data-bs-target="#modalContenido" (click)="abrirOpcion(opciones[1])" aria-label="Objetivos">
          <img class="img-fluid conoce-img" src="/assets/images/conoce/objetivos.png" alt="Objetivos">
        </button>
      </div>

      <!-- NUESTRA LABOR -->
      <div class="col-12 col-sm-6 col-lg-3 text-center">
        <button type="button" class="btn p-0 border-0 conoce-btn" data-bs-toggle="modal" data-bs-target="#modalContenido" (click)="abrirOpcion(opciones[2])" aria-label="Nuestra labor">
          <img class="img-fluid conoce-img" src="/assets/images/conoce/labor.png" alt="Nuestra labor">
        </button>      
      </div>

      <!-- QUÉ HACEMOS POR MÉXICO -->
      <div class="col-12 col-sm-6 col-lg-3 text-center">
        <button type="button" class="btn p-0 border-0 conoce-btn" data-bs-toggle="modal" data-bs-target="#modalContenido" (click)="abrirOpcion(opciones[3])" aria-label="Qué hacemos por México">
          <img class="img-fluid conoce-img" src="/assets/images/conoce/hacemosxmexico.png" alt="Qué hacemos por México"> 
        </button>      
      </div>
    </div>

    <!-- MODAL -->
    <app-modal-contenido [opcion]="opcionSeleccionada"></app-modal-contenido>
  </div>
</section>
